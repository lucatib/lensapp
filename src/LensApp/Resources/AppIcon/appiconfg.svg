<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <!-- Lens: barrel ring, glass, and the delta of the app's own readout inside it.
       Everything sits inside r=150 (66% of the canvas) so it survives Android's
       adaptive-icon safe-zone crop. -->

  <!-- glass -->
  <circle cx="228" cy="228" r="130" fill="#2271B3" />

  <!-- highlight, so the disc reads as glass rather than a flat dot -->
  <path d="M 155 175 A 110 110 0 0 1 245 128"
        fill="none" stroke="#FFFFFF" stroke-width="14"
        stroke-linecap="round" opacity="0.32" />

  <!-- delta -->
  <polygon points="228,184 308,312 148,312" fill="#FFFFFF" />

  <!-- barrel -->
  <circle cx="228" cy="228" r="150" fill="none" stroke="#F2F5F9" stroke-width="20" />
</svg>
